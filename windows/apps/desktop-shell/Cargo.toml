[package]
name = "markowski-desktop-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Thin Tauri 2 desktop shell for Markowski Windows"

[lib]
name = "markowski_desktop_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
markowski-core = { path = "../../crates/markowski-core" }
tauri = { version = "2", features = [] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Keep the verified Rust 1.87 MSVC host compatible with current Tauri
# dependency resolution. These are transitive compatibility pins only.
plist = "=1.7.0"
serde_with = "=3.12.0"
time = "=0.3.37"
