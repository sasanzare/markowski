[workspace]
members = [
    "apps/desktop-ui",
    "apps/desktop-shell",
    "crates/markowski-core",
    "crates/markowski-document",
    "crates/markowski-platform-windows",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
notify = "7"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging"] }
